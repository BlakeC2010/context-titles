name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Prepare installable plugin folder
        shell: bash
        run: |
          mkdir -p dist/context-titles
          cp main.js manifest.json styles.css dist/context-titles/

      - name: Upload installable plugin
        uses: actions/upload-artifact@v4
        with:
          name: context-titles-1.0.0
          path: dist/context-titles
